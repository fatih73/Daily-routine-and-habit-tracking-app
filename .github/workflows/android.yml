name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Paketleri kur
        run: npm install --legacy-peer-deeps

      - name: Capacitor kur
        run: npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deeps

      - name: Web uygulamasini derle
        run: npm run build

      - name: Capacitor ayarla
        run: |
          npx cap init "Gunluk Rutin" com.jir.rutin --web-dir=dist
          npx cap add android
          npx cap sync android

      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: uygulama-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
